name: doctrace-managed-v1

services:
  lightrag_managed:
    profiles: [managed]
    image: ghcr.io/hkuds/lightrag@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    ports:
      - "127.0.0.1:9631:9621"
    volumes:
      - ../runtime/upgrade/managed-lightrag.env:/app/.env:ro
      - ../runtime/doctrace_managed_v1/rag_storage:/app/data/rag_storage
      - ../runtime/doctrace_managed_v1/inputs:/app/data/inputs
      - ../runtime/doctrace_managed_v1/prompts:/app/data/prompts
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKSPACE: "doctrace_managed_v1"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      LIGHTRAG_API_KEY: "${MANAGED_LIGHTRAG_API_KEY:?Set a dedicated managed API key}"
      LIGHTRAG_KV_STORAGE: "JsonKVStorage"
      LIGHTRAG_VECTOR_STORAGE: "NanoVectorDBStorage"
      LIGHTRAG_GRAPH_STORAGE: "NetworkXStorage"
      LIGHTRAG_DOC_STATUS_STORAGE: "JsonDocStatusStorage"
      MAX_PARALLEL_INSERT: "1"
      MAX_ASYNC: "1"
      WEBUI_TITLE: "DocTrace Managed Knowledge v1"
    restart: unless-stopped
