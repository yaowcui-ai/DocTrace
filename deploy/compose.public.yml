name: doctrace-hr-v3

services:
  lightrag_hr_v3:
    image: ghcr.io/hkuds/lightrag@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    ports:
      - "127.0.0.1:9624:9621"
    env_file:
      - ../.lightrag.env
      - ../runtime/hr_prelimit/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKSPACE: "gitlab_hr_v3"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      LIGHTRAG_KV_STORAGE: "JsonKVStorage"
      LIGHTRAG_VECTOR_STORAGE: "NanoVectorDBStorage"
      LIGHTRAG_GRAPH_STORAGE: "NetworkXStorage"
      LIGHTRAG_DOC_STATUS_STORAGE: "JsonDocStatusStorage"
      MAX_PARALLEL_INSERT: "1"
      MAX_ASYNC: "2"
      DOCTRACE_PRELIMIT_ENABLED: "1"
      DOCTRACE_POLICY_CACHE_DIR: "/app/data/doctrace_policy_cache"
      MAX_TOTAL_TOKENS: "40000"
      RERANK_BY_DEFAULT: "false"
      WEBUI_TITLE: "DocTrace HR Knowledge Base"
    volumes:
      - ../.lightrag.env:/app/.env:ro
      - ../runtime/gitlab_hr_v3/rag_storage:/app/data/rag_storage
      - ../runtime/gitlab_hr_v3/inputs:/app/data/inputs
      - ../runtime/gitlab_hr_v3/prompts:/app/data/prompts
      - ../runtime/hr_prelimit/operate.py:/app/lightrag/operate.py:ro
      - ../runtime/hr_prelimit/cache:/app/data/doctrace_policy_cache
      - ../app:/app/doctrace_ext:ro
    restart: unless-stopped
