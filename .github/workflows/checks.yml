name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt -r requirements-dev.txt -r requirements-dev.txt
      - run: python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4o-mini')"
      - run: python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4o-mini')"
      - run: python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4o-mini')"
      - run: python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:frontend
